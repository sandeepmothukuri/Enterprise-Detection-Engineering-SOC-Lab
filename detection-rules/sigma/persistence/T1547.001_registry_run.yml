title: Persistence via Registry Run Keys
id: d4e5f6a7-b8c9-4012-d3e4-f5a6b7c8d901
status: test
description: Detects writes to Windows Run and RunOnce registry keys associated with persistence.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
      - '\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'
      - '\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce'
      - '\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run'
  filter:
    Image|contains:
      - '\\Program Files\\'
      - '\\Windows\\System32\\'
  condition: selection and not filter
falsepositives:
  - Approved installers and enterprise endpoint management software
level: medium
