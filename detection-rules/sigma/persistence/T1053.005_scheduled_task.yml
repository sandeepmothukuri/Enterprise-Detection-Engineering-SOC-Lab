title: Suspicious Scheduled Task Creation
id: c3d4e5f6-a7b8-4901-c2d3-e4f5a6b7c890
status: test
description: Detects creation of scheduled tasks associated with script interpreters or signed binary proxy execution.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  suspicious:
    CommandLine|contains:
      - 'powershell'
      - 'wscript'
      - 'cscript'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
  condition: selection and suspicious
falsepositives:
  - Enterprise software deployment and administrative scheduled tasks
level: high
