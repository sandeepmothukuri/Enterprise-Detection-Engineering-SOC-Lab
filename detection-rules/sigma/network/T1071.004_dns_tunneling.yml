title: DNS Tunneling / Covert C2 Channel
id: b2c3d4e5-f6a7-4890-b1c2-d3e4f5a6b789
status: test
description: Detects unusually long DNS queries that may indicate DNS tunneling or covert command and control.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1071/004/
tags:
  - attack.command_and_control
  - attack.t1071.004
logsource:
  category: dns
  product: zeek
detection:
  long_query:
    query|re: '.{60,}'
  condition: long_query
falsepositives:
  - CDNs, software update systems and other applications that legitimately use long DNS labels
level: high
