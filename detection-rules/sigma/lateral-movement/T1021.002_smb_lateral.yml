title: Lateral Movement via SMB
id: 9c8d7e6f-5a4b-4321-c0d9-e8f7a6b5c4d3
status: test
description: Detects network connections to SMB destination port 445 that are not associated with common benign system processes.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    EventID: 3
    DestinationPort: 445
    Initiated: 'true'
  filter:
    Image|endswith:
      - '\\explorer.exe'
      - '\\svchost.exe'
      - '\\System'
  condition: selection and not filter
falsepositives:
  - Normal Windows file-sharing activity from approved hosts
level: high
