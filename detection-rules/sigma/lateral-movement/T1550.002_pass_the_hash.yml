title: Pass-the-Hash Attack
id: a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789
status: test
description: Detects NTLM network logons with characteristics associated with pass-the-hash activity.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1550/002/
tags:
  - attack.lateral_movement
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: NTLM
    KeyLength: 0
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter
falsepositives:
  - Legacy applications using NTLM authentication
level: high
