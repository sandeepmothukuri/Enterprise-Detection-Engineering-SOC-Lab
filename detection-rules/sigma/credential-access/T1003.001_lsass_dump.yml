title: LSASS Memory Access — Credential Dumping
id: 2b1c4d6e-8f01-42a3-b5c7-d9e1f3a5b7c9
status: test
description: Detects suspicious process access to LSASS memory associated with credential dumping.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x147a'
      - '0x1fffff'
  filter:
    SourceImage|endswith:
      - '\\MsMpEng.exe'
      - '\\csrss.exe'
      - '\\wininit.exe'
  condition: selection and not filter
falsepositives:
  - Approved endpoint security or operating-system processes not covered by the filter
level: critical
