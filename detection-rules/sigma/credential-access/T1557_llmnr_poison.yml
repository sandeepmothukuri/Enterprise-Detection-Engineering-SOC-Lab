title: LLMNR/NBT-NS Poisoning — Responder Activity
id: 3c2d4e5f-6a7b-48c9-9d0e-1f2a3b4c5d6e
status: test
description: Detects LLMNR or NBT-NS traffic associated with name-resolution poisoning activity.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1557/001/
tags:
  - attack.credential_access
  - attack.t1557.001
logsource:
  category: network_connection
  product: zeek
detection:
  selection_llmnr:
    resp_p: 5355
    proto: udp
  selection_nbns:
    resp_p: 137
    proto: udp
  condition: selection_llmnr or selection_nbns
falsepositives:
  - Normal Windows name-resolution traffic on networks where LLMNR or NetBIOS is enabled
level: high
