title: Data Exfiltration via C2 Channel
id: 8b7c6d5e-4f3a-4210-b9c8-d7e6f5a4b3c2
status: test
description: Detects large outbound transfers from an internal host over a network connection.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1041/
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: network_connection
  product: zeek
detection:
  selection:
    local_orig: true
    local_resp: false
    orig_bytes|gte: 5000000
  filter:
    resp_h:
      - '1.1.1.1'
      - '8.8.8.8'
  condition: selection and not filter
falsepositives:
  - Approved backups and large software distribution transfers
level: high
