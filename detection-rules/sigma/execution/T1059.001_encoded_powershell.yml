title: Suspicious Encoded PowerShell Execution
id: 7a6b5c4d-3e2f-4109-b8c7-d6e5f4a3b2c1
status: test
description: Detects PowerShell encoded or obfuscated command execution and common download/execution patterns.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - 'IEX('
      - 'Invoke-Expression'
      - 'DownloadString'
      - 'FromBase64String'
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
  condition: selection
falsepositives:
  - Authorized PowerShell automation using encoded command lines
level: high
