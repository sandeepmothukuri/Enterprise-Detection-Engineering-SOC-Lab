title: WMI Remote Code Execution
id: 6f5e4d3c-2b1a-4098-b7c6-d5e4f3a2b1c0
status: test
description: Detects WMIC usage for remote process execution.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1047/
tags:
  - attack.execution
  - attack.t1047
  - attack.lateral_movement
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\wmic.exe'
    CommandLine|contains:
      - '/node:'
      - 'process call create'
  condition: selection
falsepositives:
  - Administrative WMI tooling used for approved remote management
level: high
