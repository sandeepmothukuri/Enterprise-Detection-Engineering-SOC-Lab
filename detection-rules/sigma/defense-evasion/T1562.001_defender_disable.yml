title: Windows Defender Disabled
id: 4d3e5f6a-7b8c-49d0-a1e2-f3b4c5d6e7f8
status: test
description: Detects commands or registry changes intended to disable Windows Defender real-time protection.
author: SOC Lab
date: 2026-09-14
references:
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains:
      - 'Set-MpPreference -DisableRealtimeMonitoring $true'
      - 'sc stop WinDefend'
      - 'sc config WinDefend start=disabled'
  selection_reg:
    TargetObject|contains: '\\Windows Defender\\DisableAntiSpyware'
    Details: 'DWORD (0x00000001)'
  condition: selection_cmd or selection_reg
falsepositives:
  - Authorized endpoint security maintenance performed by administrators
level: critical
