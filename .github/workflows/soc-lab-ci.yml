name: SOC Lab CI — Validate Configs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    name: Validate detection rules and runtime configuration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate Sigma rules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path("detection-rules/sigma").rglob("*.yml"))
          assert files, "No Sigma rules found"
          for path in files:
              data = yaml.safe_load(path.read_text())
              for key in ("title", "logsource", "detection"):
                  assert key in data, f"{path}: missing {key}"
          print(f"Validated {len(files)} Sigma rules")
          PY

      - name: Validate ElastAlert2 rules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path("config/elastalert2/rules").glob("*.yml"))
          assert files, "No ElastAlert2 rules found"
          required = {"name", "type", "index", "alert"}
          for path in files:
              data = yaml.safe_load(path.read_text())
              missing = required - set(data)
              assert not missing, f"{path}: missing {sorted(missing)}"
          print(f"Validated {len(files)} ElastAlert2 rules")
          PY

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find . -maxdepth 3 -type f -name '*.sh' -not -path './.git/*' | sort)

      - name: Validate detection layer with containers
        run: bash tools/validate-detections.sh

      - name: Lint Python application code
        run: |
          python -m pip install --disable-pip-version-check pyflakes
          find ai-agents ws-streamer -name '*.py' -print0 | xargs -0 -r python -m pyflakes

      - name: Check environment template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.env.example').read_text()
          required = [
              'OPENSEARCH_INITIAL_ADMIN_PASSWORD=', 'ZEEK_INTERFACE=',
              'SURICATA_INTERFACE=', 'VECTOR_SYSLOG_UDP=', 'IRIS_SECRET_KEY=',
              'MISP_ADMIN_PASSWORD=', 'ST2_AUTH_TOKEN=', 'CREWAI_API_PORT=',
              'SOC_NETWORK='
          ]
          missing = [key for key in required if key not in text]
          assert not missing, f"Missing environment keys: {missing}"
          print(f"Environment template contains {len(text.splitlines())} lines")
          PY

  security-scan:
    runs-on: ubuntu-latest
    name: Security hygiene

    steps:
      - uses: actions/checkout@v4

      - name: Verify .env is ignored
        run: grep -qxF '.env' .gitignore

      - name: Scan for obvious committed credentials
        run: |
          set -euo pipefail
          if grep -RInE 'password[[:space:]]*[:=][[:space:]]*([A-Za-z0-9]{12,}|AdminPassword123)' \
              --exclude='.env.example' --exclude-dir=.git --exclude='*.md' .; then
            echo 'Potential hard-coded credential found.'
            exit 1
          fi
          echo 'No obvious hard-coded credentials found.'
