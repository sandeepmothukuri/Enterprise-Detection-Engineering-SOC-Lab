name: SOC Lab CI — Validate Configs

on:
  push:
    branches: [main, develop, production-hardening-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    name: Validate detection and deployment configuration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate repository
        run: ./tools/validate-detections.sh

      - name: Validate shell scripts
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate Docker build contexts and Dockerfiles
        run: |
          python3 - <<'PY'
          import subprocess
          data = subprocess.check_output([
              'docker', 'compose', '--env-file', '.env.example', 'config', '--format', 'json'
          ], text=True)
          import json
          compose = json.loads(data)
          for name, service in compose.get('services', {}).items():
              build = service.get('build')
              if not build:
                  continue
              context = build.get('context', '.')
              dockerfile = build.get('dockerfile', 'Dockerfile')
              import pathlib
              context_path = pathlib.Path(context)
              dockerfile_path = context_path / dockerfile
              assert context_path.is_dir(), f'{name}: missing build context {context}'
              assert dockerfile_path.is_file(), f'{name}: missing Dockerfile {dockerfile_path}'
              print(f'OK: {name} -> {dockerfile_path}')
          PY

      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm \
            -v "$PWD/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.26-alpine nginx -t

      - name: Validate Python agent syntax
        run: |
          python -m compileall -q ai-agents ws-streamer

  security-scan:
    runs-on: ubuntu-latest
    name: Security and secret hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Check ignored secret files
        run: |
          grep -q '^\.env$' .gitignore
          grep -q '^\*.pem$' .gitignore
          grep -q '^\*.key$' .gitignore
          grep -q '^config/opensearch/certs/' .gitignore
          echo 'Secret/generated-file ignore rules present.'

      - name: Check for committed private keys
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |)PRIVATE KEY-----' -- ':!*.md' ':!.env.example'; then
            echo 'Private key material is committed.'
            exit 1
          fi

      - name: Check obsolete OpenSearch credential variable
        run: |
          if git grep -n 'OPENSEARCH_PASSWORD' -- ':!README.md' ':!.git*'; then
            echo 'Obsolete OPENSEARCH_PASSWORD reference found.'
            exit 1
          fi
          echo 'Canonical OpenSearch password variable is in use.'
