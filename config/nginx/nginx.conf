# Nginx Reverse Proxy — SOC Lab Dashboard Gateway
# Routes the existing SOC tool UIs through the local portal.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    upstream opensearch_dashboards { server opensearch-dashboards:5601; }
    upstream dfir_iris { server dfir-iris:443; }
    upstream misp { server misp:80; }
    upstream velociraptor { server velociraptor:8889; }
    upstream caldera { server caldera:8888; }
    upstream stackstorm { server stackstorm:9101; }
    upstream ai_agents { server crewai-soc:8000; }
    upstream ws_streamer { server ws-streamer:8765; }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
        location /ws/ {
            proxy_pass http://ws_streamer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
        location /api/agents/ {
            proxy_pass http://ai_agents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 5601;
        location / {
            proxy_pass http://opensearch_dashboards;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 8000;
        location / {
            proxy_pass https://dfir_iris;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/iris-ca.pem;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name dfir-iris;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8080;
        client_max_body_size 50m;
        location / {
            proxy_pass http://misp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8889;
        location / {
            proxy_pass https://velociraptor;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/velociraptor-ca.pem;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name VelociraptorServer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 8888;
        location / { proxy_pass http://caldera; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    }

    server {
        listen 9101;
        location / { proxy_pass http://stackstorm; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    }
}
