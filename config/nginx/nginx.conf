# Nginx Reverse Proxy — SOC Lab Dashboard Gateway
# Routes all SOC tool UIs through a single entry point

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Docker Embedded DNS Resolver for dynamic upstream routing
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── SOC Portal (port 80) — index of all dashboards ───────────────────────
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # WebSocket live alert stream
        location /ws/ {
            set $ws_upstream "http://ws-streamer:8765";
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # AI Agent API proxy
        location /api/agents/ {
            set $ai_upstream "http://crewai-soc:8000";
            proxy_pass $ai_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── OpenSearch Dashboards ── :5601 ────────────────────────────────────────
    server {
        listen 5601;
        location / {
            set $os_dash "http://opensearch-dashboards:5601";
            proxy_pass $os_dash;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
        }
    }

    # ── DFIR-IRIS ── :8000 ───────────────────────────────────────────────────
    server {
        listen 8000;
        location / {
            set $iris_upstream "http://dfir-iris:8000";
            proxy_pass $iris_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── MISP ── :8080 ────────────────────────────────────────────────────────
    server {
        listen 8080;
        client_max_body_size 50m;
        location / {
            set $misp_upstream "http://misp:80";
            proxy_pass $misp_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── Velociraptor ── :8889 ────────────────────────────────────────────────
    server {
        listen 8889;
        location / {
            set $velo_upstream "http://velociraptor:8889";
            proxy_pass $velo_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── MITRE Caldera ── :8888 ───────────────────────────────────────────────
    server {
        listen 8888;
        location / {
            set $caldera_upstream "http://caldera:8888";
            proxy_pass $caldera_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── StackStorm UI ── :9101 ───────────────────────────────────────────────
    server {
        listen 9101;
        location / {
            set $st2_upstream "http://stackstorm:9101";
            proxy_pass $st2_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
