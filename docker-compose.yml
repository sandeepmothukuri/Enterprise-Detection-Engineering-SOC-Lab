# ================================================================
#  Enterprise Detection Engineering SOC Lab
#  Complete SOC stack: SIEM + NSM + SOAR + DFIR + TI + AI + Red Team
# ================================================================

x-logging: &logging
  driver: "json-file"
  options: { max-size: "50m", max-file: "5" }

x-restart: &restart
  restart: unless-stopped

networks:
  soc-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soc-net-br
    ipam:
      config:
        - subnet: ${SOC_NETWORK:-172.20.0.0/16}
  red-team:
    driver: bridge
    internal: true

volumes:
  opensearch-data1:
  opensearch-data2:
  dfir-iris-data:
  dfir-iris-db:
  misp-data:
  misp-db:
  velociraptor-data:
  caldera-data:
  ollama-data:
  vector-data:
  zeek-logs:
  suricata-logs:
  st-packs:
  st-configs:
  st-db:
  st-mq:

services:
  opensearch-node1:
    image: opensearchproject/opensearch:2.13.0
    container_name: soc-opensearch-1
    hostname: opensearch-node1
    <<: *restart
    environment:
      - cluster.name=soc-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - ./config/opensearch/opensearch-node1.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch/certs/opensearch-node1.pem:/usr/share/opensearch/config/opensearch-node1.pem:ro
      - ./config/opensearch/certs/opensearch-node1-key.pem:/usr/share/opensearch/config/opensearch-node1-key.pem:ro
      - ./config/opensearch/certs/root-ca.pem:/usr/share/opensearch/config/root-ca.pem:ro
      - ./config/opensearch/certs/opensearch-admin.pem:/usr/share/opensearch/config/opensearch-admin.pem:ro
      - ./config/opensearch/certs/opensearch-admin-key.pem:/usr/share/opensearch/config/opensearch-admin-key.pem:ro
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    networks:
      soc-net: { ipv4_address: 172.20.0.10 }
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf --cert /usr/share/opensearch/config/opensearch-admin.pem --key /usr/share/opensearch/config/opensearch-admin-key.pem --cacert /usr/share/opensearch/config/root-ca.pem https://localhost:9200/_cluster/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  opensearch-node2:
    image: opensearchproject/opensearch:2.13.0
    container_name: soc-opensearch-2
    hostname: opensearch-node2
    <<: *restart
    environment:
      - cluster.name=soc-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
      - ./config/opensearch/opensearch-node2.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch/certs/opensearch-node2.pem:/usr/share/opensearch/config/opensearch-node2.pem:ro
      - ./config/opensearch/certs/opensearch-node2-key.pem:/usr/share/opensearch/config/opensearch-node2-key.pem:ro
      - ./config/opensearch/certs/root-ca.pem:/usr/share/opensearch/config/root-ca.pem:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.11 }
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf --cert /usr/share/opensearch/config/opensearch-node2.pem --key /usr/share/opensearch/config/opensearch-node2-key.pem --cacert /usr/share/opensearch/config/root-ca.pem https://localhost:9200/_cluster/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: soc-dashboards
    hostname: opensearch-dashboards
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      SERVER_NAME: soc-dashboards
    volumes:
      - ./config/opensearch/dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ./config/opensearch/certs/root-ca.pem:/usr/share/opensearch-dashboards/config/root-ca.pem:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.12 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  zeek:
    image: zeek/zeek:8.2.2
    working_dir: /opt/zeek/logs
    command: ["/opt/zeek/zeek-entrypoint.sh"]
    container_name: soc-zeek
    hostname: zeek
    <<: *restart
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      - ZEEK_INTERFACE=${ZEEK_INTERFACE:-auto}
      - SOC_NETWORK=${SOC_NETWORK:-172.20.0.0/16}
    volumes:
      - zeek-logs:/opt/zeek/logs
      - ./config/zeek/local.zeek:/opt/zeek/share/zeek/site/local.zeek:ro
      - ./config/zeek/soc-detections.zeek:/opt/zeek/share/zeek/site/soc-detections.zeek:ro
      - ./config/zeek/zeekctl.cfg:/opt/zeek/etc/zeekctl.cfg:ro
      - ./tools/zeek-entrypoint.sh:/opt/zeek/zeek-entrypoint.sh:ro
    logging: *logging

  suricata:
    image: jasonish/suricata:7.0
    container_name: soc-suricata
    hostname: suricata
    <<: *restart
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      - SURICATA_OPTIONS=-i ${SURICATA_INTERFACE:-eth0}
    volumes:
      - suricata-logs:/var/log/suricata
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./detection-rules/suricata:/etc/suricata/rules/custom:ro
    logging: *logging

  vector:
    image: timberio/vector:0.38.0-debian
    container_name: soc-vector
    hostname: vector
    <<: *restart
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "${VECTOR_API_PORT:-8686}:8686"
      - "${VECTOR_SYSLOG_UDP:-514}:514/udp"
      - "${VECTOR_BEATS_PORT:-5044}:5044"
      - "${VECTOR_WINDOWS_PORT:-6000}:6000"
      - "${VECTOR_LINUX_PORT:-6001}:6001"
      - "${VECTOR_CLOUD_PORT:-6002}:6002"
      - "${VECTOR_ZEEK_PORT:-6003}:6003"
      - "${VECTOR_SURICATA_PORT:-6004}:6004"
    volumes:
      - ./config/vector/vector.toml:/etc/vector/vector.toml:ro
      - ./config/opensearch/certs/opensearch-admin.pem:/etc/vector/opensearch-admin.pem:ro
      - ./config/opensearch/certs/opensearch-admin-key.pem:/etc/vector/opensearch-admin-key.pem:ro
      - ./config/opensearch/certs/root-ca.pem:/etc/vector/root-ca.pem:ro
      - vector-data:/var/lib/vector
      - zeek-logs:/zeek-logs:ro
      - suricata-logs:/suricata-logs:ro
    depends_on:
      opensearch-node1: { condition: service_healthy }
    networks:
      soc-net: { ipv4_address: 172.20.0.30 }
    logging: *logging

  elastalert2:
    image: jertel/elastalert2:2.19.1
    container_name: soc-elastalert2
    hostname: elastalert2
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    environment: [TZ=UTC]
    volumes:
      - ./config/elastalert2/config.yml:/opt/elastalert/config.yml:ro
      - ./config/elastalert2/rules:/opt/elastalert/rules:ro
      - ./config/opensearch/certs/opensearch-admin.pem:/etc/elastalert/opensearch-admin.pem:ro
      - ./config/opensearch/certs/opensearch-admin-key.pem:/etc/elastalert/opensearch-admin-key.pem:ro
      - ./config/opensearch/certs/root-ca.pem:/etc/elastalert/root-ca.pem:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.40 }
    logging: *logging

  stackstorm:
    image: stackstorm/stackstorm:3.8.1
    container_name: soc-stackstorm
    hostname: stackstorm
    <<: *restart
    depends_on: [st-mongo, st-rabbitmq]
    ports:
      - "${ST2_API_PORT:-9101}:9101"
      - "${ST2_AUTH_PORT:-9102}:9102"
    environment:
      - ST2_AUTH_TOKEN=${ST2_AUTH_TOKEN}
      - MONGO_HOST=st-mongo
      - RABBITMQ_HOST=st-rabbitmq
    volumes:
      - st-packs:/opt/stackstorm/packs
      - st-configs:/opt/stackstorm/configs
      - ./config/stackstorm/packs/soc_automation:/opt/stackstorm/packs/soc_automation:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.50 }
    healthcheck:
      test: ["CMD-SHELL", "st2ctl status >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging: *logging

  st-mongo:
    image: mongo:7.0
    container_name: soc-st-mongo
    volumes: [st-db:/data/db]
    networks: { soc-net: { ipv4_address: 172.20.0.51 } }

  st-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: soc-st-rabbitmq
    volumes: [st-mq:/var/lib/rabbitmq]
    networks: { soc-net: { ipv4_address: 172.20.0.52 } }

  dfir-iris:
    image: ghcr.io/dfir-iris/irisdockerproject:v2.4.9
    container_name: soc-dfir-iris
    hostname: dfir-iris
    <<: *restart
    depends_on: [iris-db]
    ports: ["${IRIS_PORT:-8443}:443"]
    environment:
      - IRIS_SECRET_KEY=${IRIS_SECRET_KEY}
      - IRIS_ADM_USERNAME=administrator
      - IRIS_ADM_PASSWORD=${IRIS_ADMIN_PASSWORD}
      - IRIS_ADM_API_KEY=${IRIS_ADM_API_KEY}
      - IRIS_ADM_EMAIL=${MISP_ADMIN_EMAIL}
      - IRIS_SECURITY_REGISTRATION_ENABLE=false
      - DB_USER=iris
      - DB_PASS=${IRIS_DB_PASSWORD}
      - DB_HOST=iris-db
      - DB_PORT=5432
      - DB_NAME=iris_db
    volumes: [dfir-iris-data:/home/iris/data]
    networks: { soc-net: { ipv4_address: 172.20.0.60 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://localhost:443/ >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging: *logging

  iris-db:
    image: postgres:16-alpine
    container_name: soc-iris-db
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${IRIS_DB_PASSWORD}
      POSTGRES_DB: iris_db
    volumes: [dfir-iris-db:/var/lib/postgresql/data]
    networks: { soc-net: { ipv4_address: 172.20.0.61 } }

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.45
    container_name: soc-misp
    hostname: misp
    <<: *restart
    depends_on: [misp-db, misp-redis]
    ports: ["${MISP_PORT:-8080}:80"]
    environment:
      - MISP_BASEURL=${MISP_BASEURL}
      - MISP_ADMIN_EMAIL=${MISP_ADMIN_EMAIL}
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSWORD}
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD}
      - REDIS_FQDN=misp-redis
    volumes: [misp-data:/var/www/MISP/app/files]
    networks: { soc-net: { ipv4_address: 172.20.0.70 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf http://localhost/users/heartbeat >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging: *logging

  misp-db:
    image: mysql:8.0
    container_name: soc-misp-db
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MISP_MYSQL_ROOT_PASSWORD}
    volumes: [misp-db:/var/lib/mysql]
    networks: { soc-net: { ipv4_address: 172.20.0.71 } }

  misp-redis:
    image: redis:7-alpine
    container_name: soc-misp-redis
    networks: { soc-net: { ipv4_address: 172.20.0.72 } }

  velociraptor:
    image: wlambert/velociraptor:0.76.3
    container_name: soc-velociraptor
    hostname: velociraptor
    <<: *restart
    ports:
      - "${VELOCIRAPTOR_PORT:-8889}:8889"
      - "${VELOCIRAPTOR_API_PORT:-8001}:8001"
      - "8000:8000"
    environment:
      - VELOX_USER=${VELOX_USER:-admin}
      - VELOX_PASSWORD=${VELOX_PASSWORD}
      - VELOX_ROLE=${VELOX_ROLE:-administrator}
      - VELOX_SERVER_URL=${VELOX_SERVER_URL:-https://velociraptor:8000/}
      - VELOX_FRONTEND_HOSTNAME=${VELOX_FRONTEND_HOSTNAME:-velociraptor}
    volumes: [velociraptor-data:/velociraptor]
    networks: { soc-net: { ipv4_address: 172.20.0.80 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://localhost:8889/ >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging: *logging

  caldera:
    image: ghcr.io/mitre/caldera:5.2.0
    container_name: soc-caldera
    hostname: caldera
    <<: *restart
    ports: ["${CALDERA_PORT:-8888}:8888"]
    environment:
      - CALDERA_URL=http://caldera:8888
      - CALDERA_API_KEY_RED=${CALDERA_API_KEY_RED}
      - CALDERA_API_KEY_BLUE=${CALDERA_API_KEY_BLUE}
      - CALDERA_RED_PASS=${CALDERA_RED_PASS}
      - CALDERA_BLUE_PASS=${CALDERA_BLUE_PASS}
    volumes:
      - caldera-data:/app/data
      - ./config/caldera/local.yml:/app/conf/local.yml:ro
      - ./attack-simulation/caldera/operations:/app/data/operations:ro
      - ./attack-simulation/caldera/adversaries:/app/data/adversaries:ro
    networks: { soc-net: { ipv4_address: 172.20.0.90 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  responder:
    build: { context: ./config/responder, dockerfile: Dockerfile }
    container_name: soc-responder
    hostname: responder
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    environment: [RESPONDER_INTERFACE=${RESPONDER_INTERFACE:-eth0}]
    volumes:
      - ./config/responder/Responder.conf:/opt/Responder/Responder.conf:ro
      - ./attack-simulation/responder/logs:/opt/Responder/logs
    profiles: [redteam]
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.0
    container_name: soc-ollama
    hostname: ollama
    <<: *restart
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes: [ollama-data:/root/.ollama]
    environment: [OLLAMA_HOST=0.0.0.0]
    networks: { soc-net: { ipv4_address: 172.20.0.100 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:11434/api/tags >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logging

  crewai-soc:
    build: { context: ./ai-agents, dockerfile: Dockerfile }
    container_name: soc-crewai
    hostname: crewai-soc
    <<: *restart
    depends_on:
      ollama: { condition: service_healthy }
      opensearch-node1: { condition: service_healthy }
    ports: ["${CREWAI_API_PORT:-8500}:8000"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_CA_CERT=/etc/opensearch/root-ca.pem
      - IRIS_URL=https://dfir-iris:443
      - IRIS_ADM_API_KEY=${IRIS_ADM_API_KEY}
      - IRIS_CA_CERT=/etc/iris/iris-ca.pem
      - MISP_URL=http://misp:80
      - MISP_API_KEY=${MISP_API_KEY}
      - ST2_URL=http://stackstorm:9101
      - ST2_TOKEN=${ST2_AUTH_TOKEN}
    volumes:
      - ./ai-agents:/app:ro
      - ./config/opensearch/certs/root-ca.pem:/etc/opensearch/root-ca.pem:ro
      - ./config/iris/iris-ca.pem:/etc/iris/iris-ca.pem:ro
    networks: { soc-net: { ipv4_address: 172.20.0.101 } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *logging

  ws-streamer:
    build: { context: ./ws-streamer, dockerfile: Dockerfile }
    container_name: soc-ws-streamer
    hostname: ws-streamer
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    ports: ["${WS_PORT:-8765}:8765"]
    environment:
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_CA_CERT=/etc/opensearch/root-ca.pem
      - WS_PORT=8765
    volumes: [./config/opensearch/certs/root-ca.pem:/etc/opensearch/root-ca.pem:ro]
    networks: { soc-net: { ipv4_address: 172.20.0.110 } }
    logging: *logging

  nginx:
    image: nginx:1.26-alpine
    container_name: soc-nginx
    hostname: nginx
    <<: *restart
    depends_on:
      opensearch-dashboards: { condition: service_healthy }
      dfir-iris: { condition: service_healthy }
      misp: { condition: service_healthy }
      velociraptor: { condition: service_healthy }
      caldera: { condition: service_healthy }
    ports: ["${SOC_PORT:-80}:80"]
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/iris/iris-ca.pem:/etc/nginx/certs/iris-ca.pem:ro
      - ./config/iris/velociraptor-ca.pem:/etc/nginx/certs/velociraptor-ca.pem:ro
      - ./dashboards:/usr/share/nginx/html:ro
    networks: { soc-net: { ipv4_address: 172.20.0.200 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logging
